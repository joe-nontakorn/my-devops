---
- name: Install Kubernetes Dashboard
  hosts: servers
  become: true
  tasks:
    - name: Install socat (needed for port-forward)
      apt:
        name: socat
        state: present
        update_cache: yes

    - name: Install Dashboard Manifests
      shell: kubectl apply -f https://raw.githubusercontent.com/kubernetes/dashboard/v2.7.0/aio/deploy/recommended.yaml

    - name: Create Dashboard Admin User and Role Binding
      shell: |
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: admin-user
          namespace: kubernetes-dashboard
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: admin-user
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
        - kind: ServiceAccount
          name: admin-user
          namespace: kubernetes-dashboard
        EOF

    - name: Generate Login Token
      shell: kubectl -n kubernetes-dashboard create token admin-user
      register: dashboard_token

    - name: Display Login Token
      debug:
        msg: "DASHBOARD TOKEN: {{ dashboard_token.stdout }}"

    - name: Information
      debug:
        msg: "Dashboard installed. To access, run: 'kubectl port-forward -n kubernetes-dashboard service/kubernetes-dashboard 3000:443 --address 0.0.0.0' inside the container."
